# PkoStat categories. Edit freely: add, rename, remove, change kinds.
# After editing run `pkostat rebuild`.
#
# kind:
#   essential      needed to live: housing, groceries, health, commuting, phone
#   discretionary  chosen spending: restaurants, clothes, hobbies, subscriptions
#   impulse        habit and convenience: delivery, taxis, convenience stores, marketplaces
#   income         money earned: salary, other income
#   transfer       money moved between people or into cash; not spending on goods
#   other          everything else
#
# label: the name shown in the app (name stays the id used by rules).
# month_shift_from_day: paid on or after this day = counted in the next month.
# description: what belongs here. The local LLM reads it when it sorts unknown merchants.

# --- essential ---------------------------------------------------------------------------

[[category]]
name = "Rent & utilities"
label = "Аренда и коммуналка"
month_shift_from_day = 25
kind = "essential"
description = "Rent, electricity, gas, water, heating, building and housing fees."

[[category]]
name = "Groceries"
label = "Продукты"
kind = "essential"
description = "Supermarkets and grocery stores: Lidl, Biedronka, Auchan, Kaufland, markets."

[[category]]
name = "Health & pharmacy"
label = "Здоровье и аптека"
kind = "essential"
description = "Pharmacies, doctors, dentists, medical labs, clinics, medicines."

[[category]]
name = "Phone & internet"
label = "Связь и интернет"
kind = "essential"
description = "Mobile plans, home internet, phone top-ups."

[[category]]
name = "Public transport & travel"
label = "Транспорт и поездки"
kind = "essential"
description = "City transport, trains, intercity buses, tickets, flights."

[[category]]
name = "Household & pets"
label = "Быт и питомцы"
kind = "essential"
description = "Planned supplies: pet food and litter, cleaning products, household chemicals, bulk buys."

